name: release-native

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            ext: .exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Build Binary
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          BIN_NAME="free-quick-share-host${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w" -o "dist/${BIN_NAME}" ./...

      - name: Package Artifact
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd go/dist
          BIN_NAME="free-quick-share-host${{ matrix.ext }}"
          ASSET_NAME="free-quick-share-host-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -q "${ASSET_NAME}" "${BIN_NAME}"
          else
            tar -czf "${ASSET_NAME}" "${BIN_NAME}"
          fi
          mv "${ASSET_NAME}" "${GITHUB_WORKSPACE}/release-assets/"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Include Install/Uninstall Scripts
        run: |
          set -euo pipefail
          cp install_host.sh release-assets/install_host.sh
          cp uninstall_host.sh release-assets/uninstall_host.sh
          cp install_host.ps1 release-assets/install_host.ps1
          cp uninstall_host.ps1 release-assets/uninstall_host.ps1

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
